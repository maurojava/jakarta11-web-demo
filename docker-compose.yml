services:
  mariadb:
    image: mariadb:10.11
    container_name: dukes_mariadb
    environment:
      MYSQL_DATABASE: dukes_db
      MYSQL_USER: duke
      MYSQL_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - dukes-net

  adminer:
    image: adminer
    container_name: dukes_adminer
    ports:
      - "2780:8080"
    depends_on:
      - mariadb
    networks:
      - dukes-net

  payara-micro:
    image: payara/micro:7.2026.7-jdk25
    container_name: dukes_payara_micro
    ports:
      - "2780:8080"
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=dukes_db
      - DB_USER=duke
      - DB_PASSWORD=secretpassword
    depends_on:
      - mariadb
    networks:
      - dukes-net

volumes:
  mariadb_data:

networks:
  dukes-net:
    driver: bridge
